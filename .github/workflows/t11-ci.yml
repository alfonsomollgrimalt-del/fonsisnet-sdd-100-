name: T11 offline validation

# No deployments, packages, paid APIs, secrets or write permissions.
# Only manual runs and pull requests, and never run jobs in a private repo
# where runner time may be billable.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t11-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source (read only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified official v4 ref 2026-11-21
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified official v5 ref 2026-11-21
        with:
          python-version: '3.11'
      - name: Validate SDD policies
        run: python scripts/validate_sdd.py
      - name: Run dependency-free tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q src scripts tests
